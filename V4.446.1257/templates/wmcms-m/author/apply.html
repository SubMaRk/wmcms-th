<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>{title}</title>
		<link rel="stylesheet" href="{templates}/static/author/css/style.css">
		<script src="{templates}/static/author/js/font.js"></script>
		<script src="{templates}/static/author/js/jquery.min.js"></script>
		<script src="{templates}/static/author/js/layer.js"></script>
	</head>
	<body>
		<div class="app">
			<div class="htitle u-f-ajc">
				<span>สมัครเป็นผู้แต่ง</span>
			</div>
			<div class="infoEdit newBook">
					<form name="Form" id="Form" method="post">
						<div class="u-f-ac inputbox">
							<div class="otc">
								<span class="name">นามปากกานักเขียน:</span>
							</div>
							<div class="input">
								<input type="text" id="nickname" name="nickname" placeholder="นามปากกาเปลี่ยนไม่ได้หลังยื่นคำขอ">
							</div>
						</div>
						
						<div class="u-f-ac inputbox">
							<div class="otc">
								<span class="name">ชื่อจริง:</span>
							</div>
							<div class="input">
								<input type="text" id="realname" name="realname" placeholder="กรุณาใช้อักษรจีนหรืออังกฤษ 2~10 ตัว!">
							</div>
						</div>
						
						<div class="u-f-ac inputbox">
							<div class="otc">
								<span class="name">เลขบัตรประชาชน:</span>
							</div>
							<div class="input">
								<input type="text" id="cardid" name="cardid" placeholder="กรุณากรอกเลขบัตรประชาชนจริงของคุณ">
							</div>
						</div>
						
						<div class="u-f-ac inputbox">
							<div class="otc">
								<span class="name">ที่อยู่ติดต่อ:</span>
							</div>
							<div class="input">
								<input type="text" id="address" name="address" placeholder="เพื่อความสะดวกในการส่งสัญญาทางไปรษณีย์">
							</div>
						</div>
						
						<div class="u-f-ac">
							<input id="agreeCheckbox" name="agreement" type="checkbox" value="1"></span>
							<label class="xieyi" for="agreeCheckbox">
								ฉันได้อ่านและยอมรับแล้ว
								<a class="blue" href="{作家注册协议}" target="_blank">《ข้อตกลงการลงทะเบียนและการส่งผลงานของนักเขียน {网站名}》</a>
							</label>
						</div>
						
						<button class="submit" id="sub">ส่งข้อมูล</button>
					</form>
			</div>
		</div>
		
		<footer>
			<p>{网站名}</p>
		</footer>
		
		<script>
			var isSub = true;
			//提交注册
			$('#sub').click(function(){
				if( isSub == true){
					var nickname = $("#nickname").val();
					var realname = $("#realname").val();
					var cardid = $("#cardid").val();
					var address = $("#address").val();
					var agreement = $("#agreeCheckbox").is(':checked');
					if( nickname.length < 2 || nickname.length > 12 || !isString(nickname) ){
						layer.open({content:'นามปากกาต้องประกอบด้วยตัวเลข ตัวอักษร และภาษาจีน 2 ถึง 12 ตัว!',time: 2});
					}else if( !isName(realname) || realname.length < 2 || realname.length > 10){
						layer.open({content:'ชื่อจริงต้องเป็นภาษาจีนหรืออังกฤษ 2-10 ตัวอักษร!',time: 2});
					}else if( !isCardId(cardid) ){
						layer.open({content:'ขออภัย รูปแบบเลขบัตรประชาชนไม่ถูกต้อง!',time: 2});
					}else if( address == '' ){
						layer.open({content:'ขออภัย ที่อยู่ติดต่อห้ามว่าง!',time: 2});
					}else if( agreement == false){
						layer.open({content:'กรุณายอมรับข้อตกลงการสมัครสมาชิกก่อน!',time: 2});
					}else{
						isSub = false;
						$("#sub").css("background","#B0B9C1");
						$("#sub").html("กำลังโหลด...");
						$.ajax({
							type:"POST",
							url:"{表单提交地址}&ajax=yes",
							data:$("[name=Form]").serializeArray(),
							dataType:"json",
							success:function(data){
								if(data.code == 200){
									layer.open({content:data.msg.info,time: 2});
									$('.newBook').html('<div class="sqinfo">已经提交申请，请耐心等待审核结果!</div>')
								}else{
									$("#sub").css("background","#4EA8FF");
									$("#sub").html("ส่งคำขอ");
									layer.open({content:data.msg,time: 2});
								}
								isSub = true;
							},
							async:true,
						});
						return false;
					}
				}
				return false;
			})
			/**
			 * 判断是否为身份证号
			 * 参数1，必须，字符串
			 */
			function isCardId(sId){
				var aCity={11:"ปักกิ่ง",12:"เทียนจิน",13:"เหอเป่ย์",14:"ชานซี",15:"มองโกเลียใน",21:"เหลียวหนิง",22:"จี๋หลิน",23:"เฮยหลงเจียง",31:"เซี่ยงไฮ้",32:"เจียงซู",33:"เจ้อเจียง",34:"อานฮุย",35:"ฝูเจี้ยน",36:"เจียงซี",37:"ชานตง",41:"เหอหนาน",42:"หูเป่ย์",43:"หูหนาน",44:"กวางตุ้ง",45:"กว่างซี",46:"ไหหลำ",50:"ฉงชิ่ง",51:"เสฉวน",52:"กุ้ยโจว",53:"ยูนนาน",54:"ทิเบต",61:"ฉ่านซี",62:"กานซู่",63:"ชิงไห่",64:"หนิงเซี่ย",65:"ซินเจียง",71:"ไต้หวัน",81:"ฮ่องกง",82:"มาเก๊า",91:"ต่างประเทศ"} 
				var iSum=0;
				var info="";
				if(!/^\d{17}(\d|x)$/i.test(sId)){
					//return "你输入的身份证长度或格式错误";
					return false;
				}
				sId=sId.replace(/x$/i,"a");
				if(aCity[parseInt(sId.substr(0,2))]==null){
					//return "你的身份证地区非法";
					return false;
				}
				sBirthday=sId.substr(6,4)+"-"+Number(sId.substr(10,2))+"-"+Number(sId.substr(12,2));
				var d=new Date(sBirthday.replace(/-/g,"/")) ;
				if(sBirthday!=(d.getFullYear()+"-"+ (d.getMonth()+1) + "-" + d.getDate())){
					//return "身份证上的出生日期非法";
					return false;
				}
				for(var i = 17;i>=0;i --) iSum += (Math.pow(2,i) % 11) * parseInt(sId.charAt(17 - i),11) ;
				if(iSum%11!=1){
					//return "你输入的身份证号非法";
					return false;
				}
				//aCity[parseInt(sId.substr(0,2))]+","+sBirthday+","+(sId.substr(16,1)%2?"男":"女");//此次还可以判断出输入的身份证号的人性别
				return true;
			}
			/**
			 * 检查是否是英文、数字和中文。
			 * 参数1，必须 字符串
			 */
			function isString(str){
				var re = /^[\d|A-z|\u4E00-\u9FFF]+$/;
			    return re.test(str); 
			}
			/**
			 * 检查是否是中文或者字母组合
			 * 参数1，必须，字符串
			 */
			function isName(str){  
			     var re =  /^[0-9a-zA-Z|\u4E00-\u9FFF]*$/g;
			     return re.test(str);
			}
		</script>
	</body>
</html>
