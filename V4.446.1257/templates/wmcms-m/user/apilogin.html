<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
    <title>{title}</title>
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="{templates}/static/user/css/style.css">
    <script type="text/javascript" src="{templates}/static/user/js/flexible.min.js"></script>
</head>
<body>
	<div class="app_meskSection"></div>
	<div class="container">
		<div class="app_header_section2  app_scrollerHeader" id="header">
			<div class="app_header_detail2">
				<div class="app_header_back"></div>
				<div class="app_header_h1">
					ต้องผูกบัญชีเว็บไซต์
					<i class="moreIco"></i>
				</div>
			</div>
			<div class="app_header_second" style="display: none;">
				<ul>
					<li class="icon1">
						<a href="/">หน้าแรก</a>
					</li>
					<li class="icon2">
						<a href="{全部小说}">คลังหนังสือ</a>
					</li>
					<li class="icon3">
						<a href="{我的书架}">ชั้นหนังสือ</a>
					</li>
					<li class="icon4">
						<a href="{用户中心}">บัญชี</a>
					</li>
				</ul>
			</div>
		</div>
		<div class="app_body">
			<div class="app_bindPhoneBlock" id="login" style="padding-bottom: 0.6rem;">
        		<form method="post" action="{绑定提交地址}">
            		{登录隐藏表单}
    				<div class="app_lisLoinSpan app_addPaddingStyle">
    					<ul>
    						{登录隐藏表单}
    						<li class="username">
    							<input type="text" name="name" placeholder="บัญชีเข้าสู่ระบบ">	
    						</li>
    						<li class="password">
    							<input type="password" name="psw" placeholder="รหัสผ่านเข้าสู่ระบบ">
    						</li>
    					</ul>
    				</div>
    				<div class="app_listBlockButton" style="padding-top: 0.36rem">
    					<button type="submit">ผูกทันที</button>
    				</div>
	            </form>
				<a onclick="$('#reg').show();$('#login').hide()">ยังไม่มีบัญชี? สมัครสมาชิกทันที</a>
			</div>
			
			<div class="app_bindPhoneBlock" id="reg" style="display: none;">
        		<form method="post" action="{注册提交地址}">
            		{注册隐藏表单}
    				<div class="app_lisLoinSpan app_addPaddingStyle">
    					<ul>
    						<li class="username">
    							<input type="text" name="name" placeholder="กรุณากรอกชื่อผู้ใช้">	
    						</li>
    						<input type="hidden" name="sex" value="1">
    						<li class="password">
    							<input type="password" name="psw" placeholder="กรุณากรอกรหัสผ่าน">
    						</li>
    						<li class="password">
    							<input type="password" name="repsw" placeholder="กรอกรหัสผ่านอีกครั้ง">
    						</li>
    					</ul>
    				</div>
    				<div class="app_listBlockButton" style="padding-top: 0.36rem">
    					<button type="submit">สมัครสมาชิกเลย</button>
    				</div>
    				<a onclick="$('#login').show();$('#reg').hide()">มีบัญชีอยู่แล้ว? ผูกบัญชีทันที</a>
    				<div class="app_dengLu_bottom">
    						การสมัครสมาชิกถือว่าคุณยอมรับ<a class="blue">《ข้อกำหนดการให้บริการและนโยบายความเป็นส่วนตัว》</a>
    				</div>
	            </form>
			</div>
		</div>
	</div>
	<script type="text/javascript" src="{templates}/static/user/js/jquery.min.js"></script>
	<script type="text/javascript" src="{templates}/static/js/layer.js"></script>
	<script type="text/javascript" src="{templates}/static/user/js/ajax.js"></script>
	<script type="text/javascript" src="{templates}/static/user/js/user.js"></script>
</body>
</html>
