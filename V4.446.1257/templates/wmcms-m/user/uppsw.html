<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
    <title>{title}</title>
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="{templates}/static/user/css/style.css">
    <script type="text/javascript" src="{templates}/static/user/js/flexible.min.js"></script>
</head>
<body>
	<div class="app_meskSection"></div>
	<div class="container">
		<div class="app_header_section2  app_scrollerHeader" id="header">
			<div class="app_header_detail2">
				<div class="app_header_back"></div>
				<div class="app_header_h1">
					เปลี่ยนรหัสผ่าน
					<a href="{我的书架}"> <i class="shujiaIco"></i>
					</a> <i class="moreIco"></i>
				</div>
			</div>
			<div class="app_header_second" style="display: none;">
				<ul>
					<li class="icon1">
						<a href="/">หน้าแรก</a>
					</li>
					<li class="icon2">
						<a href="{全部小说}">คลังหนังสือ</a>
					</li>
					<li class="icon3">
						<a href="{我的书架}">ชั้นหนังสือ</a>
					</li>
					<li class="icon4">
						<a href="{用户中心}">บัญชี</a>
					</li>
				</ul>
			</div>
		</div>

		<div class="app_body">
			<div class="app_wanJiPassWord">
		        <div class="app_lisBlockSpan">
		            <ul>
										{表单锁}
		                <li>
		                    <span class="left">รหัสผ่านปัจจุบัน:</span>
		                    <input name="oldpsw" type="password" placeholder="กรุณากรอกรหัสผ่านปัจจุบัน">
		                </li>
		                <li>
		                    <span class="left">รหัสผ่านใหม่:</span>
		                    <input name="newpsw" type="password" placeholder="ตัวอักษรพิมพ์ใหญ่หรือเล็ก เครื่องหมาย หรือตัวเลข 6-18 ตัว">
		                </li>
		                <li>
		                    <span class="left">ยืนยันรหัสผ่าน:</span>
		                    <input name="renewpsw" type="password" placeholder="กรุณากรอกรหัสผ่านอีกครั้ง">
		                </li>
										{修改密码验证码开启}
										<li class="code">
											<span class="left">รหัสยืนยัน:</span>
											<input id="code" type="text" name="code" placeholder="กรุณากรอกรหัสยืนยัน">
										</li>
										<li style="display: flex;align-items: center;border: none;padding: 0;height: 1.3437rem;">
											{修改密码验证码}
										</li>
										{/修改密码验证码开启}
		            </ul>
		        </div>
		        <div class="app_listBlockButton app_marginStyle1" style="padding-bottom: 1.5rem">
		        	<button id="submitbtn" ajax-reg="app_lisBlockSpan" url="{表单提交地址}&ajax=yes">ยืนยัน</button>
		        </div>
		    </div>
		</div>
	</div>
	<script type="text/javascript" src="{templates}/static/user/js/jquery.min.js"></script>
	<script type="text/javascript" src="{templates}/static/js/layer.js"></script>
	<script type="text/javascript" src="{templates}/static/user/js/ajax.js"></script>
	<script type="text/javascript" src="{templates}/static/user/js/user.js"></script>
</body>
</html>
